name: Android app
on:
  push:
    paths: ['native/android/**', '.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable test APK
        working-directory: native/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify APK signature
        working-directory: native/android
        run: ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CasualPass-Android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
