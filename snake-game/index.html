<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Snake — CasualPass</title>
    <link rel="stylesheet" href="../shared-settings.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="../shared-settings.js"></script>
    <script src="../casual-profile.js"></script>
    <script src="../casual-cheats.js"></script>
</head>

<body class="theme-liquid">
    <!-- Dynamic Background via Shared Settings -->
    <div id="global-bg-container" class="background-container" aria-hidden="true"></div>

    <a href="../index.html" class="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Oyunlara Dön</span>
    </a>

    <main class="game-container">
        <header>
            <h1 class="glow-text">Snake</h1>
            <div class="score-row">
                <div class="scores" id="scores" role="status" aria-live="polite">
                    <div class="score-card">
                        <span class="player-label">Skor</span>
                        <span class="score-value" id="score">0</span>
                    </div>
                    <div class="score-card personal-best">
                        <span class="player-label">Rekor</span>
                        <span class="score-value" id="high-score">0</span>
                    </div>
                </div>
                <div class="game-actions hidden" id="game-actions">
                    <button class="icon-btn" id="pause-btn" type="button" aria-pressed="false" aria-label="Duraklat" title="Duraklat (Boşluk)">❚❚</button>
                </div>
            </div>
        </header>

        <!-- Configuration Menu (shown before start) -->
        <div id="config-menu" class="config-menu">
            <h2>Oyun Ayarları</h2>

            <div class="preset-buttons" role="group" aria-label="Hazır ayarlar">
                <button class="preset-btn" type="button" aria-pressed="false" data-preset="kolay">Kolay</button>
                <button class="preset-btn active" type="button" aria-pressed="true" data-preset="normal">Normal</button>
                <button class="preset-btn" type="button" aria-pressed="false" data-preset="zor">Zor</button>
                <button class="preset-btn" type="button" aria-pressed="false" data-preset="asiri-zor">Aşırı Zor</button>
            </div>

            <div class="custom-settings">
                <div class="setting-row">
                    <label for="grid-size">Alan boyutu <span id="grid-val">20x20</span></label>
                    <input type="range" id="grid-size" min="10" max="40" step="5" value="20">
                </div>

                <div class="setting-row">
                    <label for="speed-val">Hız <span id="speed-display">12 adım/sn</span></label>
                    <input type="range" id="speed-val" min="5" max="30" step="1" value="12">
                </div>

                <div class="setting-row toggle-row">
                    <label for="wall-death">Duvara çarpınca öl <small id="wall-hint">Kapalıyken karşı kenardan çıkarsın</small></label>
                    <label class="toggle">
                        <input type="checkbox" id="wall-death" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <button class="btn start-btn" id="start-game-btn" type="button">
                <span class="btn-text">Oyuna Başla</span>
            </button>
        </div>

        <div class="board-wrapper hidden" id="board-wrapper">
            <canvas id="game-canv" width="400" height="400" tabindex="-1" role="img" aria-label="Yılan oyun alanı"></canvas>

            <!-- Start hint, shown until the first move -->
            <div id="start-hint" class="overlay hint-overlay hidden" aria-hidden="true">
                <p class="hint-title">Hazır mısın?</p>
                <p class="hint-text hint-keys">Başlamak için bir yön tuşuna bas<br><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ya da <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></p>
                <p class="hint-text hint-touch">Başlamak için alanda kaydır ya da yön tuşlarına dokun</p>
                <p class="hint-text hint-sub hint-keys">Duraklatmak için <kbd>Boşluk</kbd> ya da <kbd>Esc</kbd></p>
            </div>

            <!-- Pause Overlay -->
            <div id="pause-overlay" class="overlay hidden" role="dialog" aria-modal="false" aria-labelledby="pause-title">
                <h2 class="overlay-title" id="pause-title">Duraklatıldı</h2>
                <button class="btn" id="resume-btn" type="button">Devam Et</button>
                <button class="btn text-btn" id="pause-menu-btn" type="button">Ayarlara Dön</button>
            </div>

            <!-- Game Over Overlay -->
            <div id="game-over-overlay" class="overlay hidden" role="dialog" aria-modal="false" aria-labelledby="game-over-title">
                <h2 class="game-over-text" id="game-over-title">Oyun Bitti</h2>
                <p class="final-score">Skor <strong id="final-score">0</strong></p>
                <p class="new-record hidden" id="new-record">Yeni rekor!</p>
                <button class="btn reset-btn" id="restart-btn" type="button">
                    <span class="btn-text">Tekrar Oyna</span>
                </button>
                <button class="btn text-btn" id="back-to-menu-btn" type="button">Ayarlara Dön</button>
            </div>
        </div>

        <!-- Touch controls: shown on touch screens while a game is on -->
        <div class="mobile-controls hidden" id="mobile-controls" role="group" aria-label="Yön tuşları">
            <button class="d-pad up" type="button" data-dir="UP" aria-label="Yukarı">▲</button>
            <button class="d-pad left" type="button" data-dir="LEFT" aria-label="Sola">◀</button>
            <button class="d-pad down" type="button" data-dir="DOWN" aria-label="Aşağı">▼</button>
            <button class="d-pad right" type="button" data-dir="RIGHT" aria-label="Sağa">▶</button>
        </div>
    </main>

    <script src="script.js"></script>

    <!-- Audio assets to be used globally -->
    <audio id="global-click-sound" src="https://cdn.freesound.org/previews/415/415096_7413867-lq.mp3"
        preload="auto"></audio>
    <audio id="global-eat-sound" src="https://cdn.freesound.org/previews/242/242501_4414128-lq.mp3"
        preload="auto"></audio>
    <audio id="global-die-sound" src="https://cdn.freesound.org/previews/382/382310_6687700-lq.mp3"
        preload="auto"></audio>
</body>

</html>
