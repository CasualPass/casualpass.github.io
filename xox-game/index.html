<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX — CasualPass</title>
    <link rel="stylesheet" href="../shared-settings.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="../shared-settings.js"></script>
    <script src="../casual-profile.js"></script>
    <script src="../casual-cheats.js"></script>
</head>

<body class="theme-liquid">
    <!-- Dynamic Background via Shared Settings -->
    <div id="global-bg-container" class="background-container" aria-hidden="true"></div>

    <a href="../index.html" class="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Oyunlara Dön</span>
    </a>

    <main class="game-container">
        <header>
            <h1 class="glow-text">XOX</h1>
        </header>

        <!-- Pre-Game Lobby / Config Menu -->
        <section id="config-menu" class="config-menu" aria-labelledby="lobby-title">
            <h2 id="lobby-title">Lobi</h2>

            <div class="custom-settings">
                <div class="setting-row">
                    <label for="player-name-input">Adın</label>
                    <input type="text" id="player-name-input" placeholder="Misafir" class="custom-input"
                        maxlength="20" autocomplete="nickname">
                    <p class="setting-hint hidden" id="profile-hint">Profil adın kullanılıyor; istersen değiştir.</p>
                </div>

                <div class="setting-row">
                    <span class="setting-label" id="mode-label">Oyun Modu</span>
                    <div class="preset-buttons" role="group" aria-labelledby="mode-label">
                        <button type="button" class="preset-btn active" id="mode-bot" aria-pressed="true">Bot'a Karşı</button>
                        <button type="button" class="preset-btn" id="mode-local" aria-pressed="false">2 Oyuncu (Lokal)</button>
                    </div>
                </div>

                <!-- Opponent Name (For Local 2P) -->
                <div class="setting-row hidden" id="local-player2-row">
                    <label for="player2-name-input">2. Oyuncu İsmi</label>
                    <input type="text" id="player2-name-input" placeholder="Oyuncu 2" class="custom-input"
                        maxlength="20">
                </div>

                <!-- Bot Difficulty (For Bot Mode) -->
                <div class="setting-row" id="bot-difficulty-row">
                    <span class="setting-label" id="difficulty-label">Bot Zorluğu</span>
                    <div class="preset-buttons preset-buttons--three" role="group" aria-labelledby="difficulty-label">
                        <button type="button" class="preset-btn active" data-difficulty="easy" aria-pressed="true">Kolay</button>
                        <button type="button" class="preset-btn" data-difficulty="medium" aria-pressed="false">Orta</button>
                        <button type="button" class="preset-btn" data-difficulty="impossible" aria-pressed="false">İmkansız</button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn start-btn" id="start-game-btn">
                <span class="btn-text">Oyuna Başla</span>
            </button>

            <!-- Leaderboard Trigger -->
            <button type="button" class="btn text-btn" id="show-leaderboard-btn">
                🏆 Liderlik Tablosu
            </button>
        </section>

        <section id="game-area" class="game-area hidden" aria-label="Oyun alanı">
            <div class="scores" id="scores">
                <div class="score-card x-score active">
                    <span class="player-mark" aria-hidden="true">X</span>
                    <span class="player-label" id="label-x">Oyuncu X</span>
                    <span class="score-value" id="score-x">0</span>
                </div>
                <div class="score-card o-score">
                    <span class="player-mark" aria-hidden="true">O</span>
                    <span class="player-label" id="label-o">Oyuncu O</span>
                    <span class="score-value" id="score-o">0</span>
                </div>
            </div>

            <div class="status-display" id="status" role="status" aria-live="polite">Sıra: Oyuncu X</div>

            <div class="board" id="board" role="group" aria-label="Oyun tahtası">
                <button type="button" class="cell" data-index="0"></button>
                <button type="button" class="cell" data-index="1"></button>
                <button type="button" class="cell" data-index="2"></button>
                <button type="button" class="cell" data-index="3"></button>
                <button type="button" class="cell" data-index="4"></button>
                <button type="button" class="cell" data-index="5"></button>
                <button type="button" class="cell" data-index="6"></button>
                <button type="button" class="cell" data-index="7"></button>
                <button type="button" class="cell" data-index="8"></button>
            </div>

            <div class="game-actions">
                <button type="button" class="btn text-btn" id="back-to-lobby-btn">
                    Lobiye Dön
                </button>
                <button type="button" class="btn reset-btn" id="reset-btn">
                    <span class="btn-text">Yeniden Başlat</span>
                </button>
            </div>
        </section>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="overlay hidden">
            <div class="config-menu leaderboard-dialog" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
                <h2 id="leaderboard-title">🏆 Liderlik Tablosu</h2>
                <div id="leaderboard-content" class="leaderboard-content">
                    <!-- Rows populated via JS -->
                </div>
                <button type="button" class="btn" id="close-leaderboard-btn">Kapat</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

    <!-- Audio assets to be used globally -->
    <audio id="global-click-sound" src="https://cdn.freesound.org/previews/415/415096_7413867-lq.mp3"
        preload="auto"></audio>
    <audio id="global-pop-sound" src="https://cdn.freesound.org/previews/242/242501_4414128-lq.mp3"
        preload="auto"></audio>
</body>

</html>
